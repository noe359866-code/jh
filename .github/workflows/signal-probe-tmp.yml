name: Sonda de señales temporal
on:
  push:
    paths:
      - '.github/workflows/signal-probe-tmp.yml'
      - 'engines/live/checker.js'
      - 'scripts/verify.js'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar señales reales
        run: node scripts/verify.js || true
      - name: Publicar informe
        if: always()
        run: |
          mkdir -p reports
          node -e "const fs=require('fs');const f='reports/health.json';const s=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{missing:true};fs.writeFileSync('reports/probe-health.json',JSON.stringify(s,null,1));"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/probe-health.json
          git diff --cached --quiet && echo sin-cambios || git commit -m "Informe de salud real (generado)"
          git push
