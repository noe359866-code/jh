name: Diagnóstico de Gnula (estructura de su API)
# Lee la definición pública de la API REST del sitio y el código que la llama.
# Solo imprime estructura (rutas, métodos, nombres de parámetro), nunca enlaces
# reproducibles. Se ejecuta a mano o al empujar cambios en ese script.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diag-gnula.js'
      - '.github/workflows/diag-gnula.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar diagnóstico
        id: diag
        run: |
          node scripts/diag-gnula.js 2>&1 | tee /tmp/diag.log
          {
            echo 'salida<<EOF'
            head -c 48000 /tmp/diag.log
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publicar resultado como comentario del commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SALIDA: ${{ steps.diag.outputs.salida }}
          MARCA: '<!-- diag-gnula -->'
        run: |
          if [ -z "$SALIDA" ]; then echo "Sin salida que publicar"; exit 0; fi
          BODY="$MARCA
          Estructura de la API de Gnula (commit ${{ github.sha }}):
          \`\`\`
          $SALIDA
          \`\`\`"
          ANTERIOR=$(gh api "repos/${{ github.repository }}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARCA\")) | .id" | head -1)
          if [ -n "$ANTERIOR" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/comments/$ANTERIOR" -f body="$BODY" >/dev/null
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" >/dev/null
          fi
