name: Sites live extraction
on:
  push:
    paths:
      - '.github/workflows/sites-live.yml'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar verificación en vivo
        run: node scripts/live-check.js || true
      - name: Volcar resumen al registro
        if: always()
        run: |
          ls -la reports || true
          cat reports/live-check-summary.txt || true
      - name: Publicar resumen en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/live-check-summary.txt reports/live-check.json || true
          git diff --cached --quiet || git commit -m "Resumen de verificación en vivo (generado)"
          git push
