name: Sites live extraction
on:
  push:
    paths:
      - 'engines/live/**'
      - 'scripts/live-check.js'
      - '.github/workflows/sites-live.yml'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar verificación en vivo
        run: node scripts/live-check.js || true
      - name: Resumen
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('reports/live-check.json')) { console.log('sin reporte'); process.exit(0); }
            const r = require('./reports/live-check.json');
            const summary = { ok: r.ok, totals: r.totals, sources: r.sources, checks: r.checks, playlistEntries: r.playlistEntries };
            console.log(JSON.stringify(summary, null, 1));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify(summary, null, 1) + '\n```\n');
          "
      - name: Publicar resumen en la rama
        if: always()
        run: |
          mkdir -p reports
          node -e 'const fs=require("fs");const file="reports/live-check.json";if(fs.existsSync(file)){const r=JSON.parse(fs.readFileSync(file,"utf8"));fs.writeFileSync("reports/live-check-summary.txt",JSON.stringify({ok:r.ok,totals:r.totals,sources:r.sources,checks:r.checks,playlistEntries:r.playlistEntries,error:r.error},null,1)+"\n");}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/live-check-summary.txt
          git diff --cached --quiet || git commit -m "Resumen de verificación en vivo (generado)"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: reports/live-check.json
          if-no-files-found: warn
          retention-days: 7
