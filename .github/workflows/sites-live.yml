name: Sites live extraction
on:
  push:
    branches:
      - arena/ccf87f6e-jh
  workflow_dispatch:
    inputs:
      page_urls:
        description: Comma-separated page URLs to test (defaults to the three site homepages)
        required: false
        default: ''
        type: string
      allowed_hosts:
        description: Comma-separated trusted hosts (add media/iframe hosts after checking them)
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sites-live.js
        env:
          SITES_TEST_URLS: ${{ inputs.page_urls }}
          SITES_ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
      - name: Commit sanitized report to report branch
        if: always()
        run: |
          mkdir -p reports
          cp reports/sites-live.json reports/sites-live-report.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/sites-live-report.json
          git commit -m "Add sanitized sites live test report" || exit 0
          git push origin HEAD:sites-live-report
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sites-live-report
          path: reports/sites-live.json
          if-no-files-found: warn
          retention-days: 7
