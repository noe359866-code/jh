name: Sites live extraction
on:
  push:
  workflow_dispatch:
    inputs:
      page_urls:
        description: Comma-separated page URLs to test (defaults to the three site homepages)
        required: false
        default: ''
        type: string
      allowed_hosts:
        description: Comma-separated trusted hosts (add media/iframe hosts after checking them)
        required: false
        default: ''
        type: string
permissions:
  contents: write
  # Necesario para publicar el resultado como comentario del commit: los logs
  # y artefactos del job no siempre son accesibles, el comentario sí.
  pull-requests: write
jobs:
  live:
    # Skip when this push came from the report commit itself: that avoids a
    # workflow loop (pushing the report retriggers the workflow).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sites-live.js
        env:
          SITES_TEST_URLS: ${{ inputs.page_urls }}
          # Default to the embed69.org iframe host used by FlixLatam; the
          # workflow_dispatch input can override it explicitly.
          SITES_ALLOWED_HOSTS: ${{ inputs.allowed_hosts || 'embed69.org' }}
      # El reporte se conserva solo como artefacto. Un reporte de fallo NO se
      # commitea: antes se versionaba con `git add -f` saltando el .gitignore y
      # quedó en el repo un reporte de error presentado como verificación real.
      - name: Resumen del resultado
        id: resumen
        if: always()
        run: |
          # El log de Actions no siempre es accesible: el resumen se publica
          # también como salida del step para poder leerlo por la API.
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('reports/sites-live.json', 'utf8'));
            const porSitio = r.tested.map(t => t.site + '=' + (t.success ? t.verifiedMedia + ' medios' : 'sin medios')
              + ' [paginas=' + (t.pages ?? 0) + ' candidatos=' + (t.candidates ?? 0) + ' frames=' + (t.frames ?? 0) + ' verificados=' + (t.verified ?? 0) + ']'
              + (t.blockedHosts?.length ? ' bloqueados=' + t.blockedHosts.join(',') : '')
              + (t.stages && Object.keys(t.stages).length
                ? ' [' + Object.entries(t.stages).map(([etapa, hosts]) => etapa + ':' + hosts.join('+')).join(' ') + ']'
                : '')
              + (t.error ? ' ERROR=' + t.error : '')).join(' | ');
            const diag = (r.events || []).filter(e => e.stage === 'servidores')
              .map(e => 'dataLink=' + e.dataLink + ' challenge=' + e.challenge + ' salt=' + e.salt
                + ' anubisPendiente=' + e.anubisPendiente + ' bytes=' + e.bytes
                + ' captcha=' + e.captcha + ' bloqueado=' + e.bloqueado).join(' ');
            const etapas = {};
            for (const e of r.events || []) etapas[e.stage] = (etapas[e.stage] || 0) + 1;
            const resumen = 'success=' + r.success + ' :: ' + porSitio + (diag ? ' :: ' + diag : '') + ' :: etapas=' + JSON.stringify(etapas);
            fs.appendFileSync(process.env.GITHUB_OUTPUT || '/dev/null', 'resumen=' + resumen + '\n');
            console.log(resumen);
            if (r.hosts) console.log('hosts:', r.hosts.join(', '));
          "

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sites-live-report
          path: reports/sites-live.json
          if-no-files-found: warn
          retention-days: 7

      # El log del job y los artefactos no siempre son accesibles. El resumen
      # se publica como comentario del commit (marcado para poder actualizarlo
      # en ejecuciones siguientes sin llenar el historial).
      - name: Publicar resumen como comentario del commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESUMEN: ${{ steps.resumen.outputs.resumen }}
          MARCA: '<!-- sites-live-resultado -->'
      # El resumen nunca contiene URLs, queries ni HTML: solo el estado por
      # sitio, conteos y nombres de host.
        run: |
          if [ -z "$RESUMEN" ]; then echo "Sin resumen que publicar"; exit 0; fi
          BODY="$MARCA
          Resultado de la extracción en vivo (commit ${{ github.sha }}):
          \`\`\`
          $RESUMEN
          \`\`\`"
          ANTERIOR=$(gh api "repos/${{ github.repository }}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARCA\")) | .id" | head -1)
          if [ -n "$ANTERIOR" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/comments/$ANTERIOR" -f body="$BODY" >/dev/null
            echo "Comentario actualizado: $ANTERIOR"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" >/dev/null
            echo "Comentario creado en ${{ github.sha }}"
          fi
