name: Sites live extraction
on:
  push:
    paths:
      - 'engines/live/**'
      - 'scripts/live-check.js'
      - '.github/workflows/sites-live.yml'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificación en vivo
        run: node scripts/live-check.js || true
      - name: Publicar salida
        if: always()
        run: |
          mkdir -p reports
          node -e "const fs=require('fs');const f='reports/live-check.json';const s=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{missing:true};fs.writeFileSync('reports/live-check-summary.txt',JSON.stringify(s,null,1));"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/live-check-summary.txt
          git diff --cached --quiet && echo sin-cambios || git commit -m "Salida de verificación en vivo (generado)"
          git push
