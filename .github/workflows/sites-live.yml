name: Sites live extraction
on:
  push:
    paths:
      - '.github/workflows/sites-live.yml'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Traza de resolución thedaddy
        run: node scripts/thedaddy-diag.js || true
      - name: Publicar diagnóstico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/thedaddy-diag.json
          git diff --cached --quiet && echo sin-cambios || git commit -m "Diagnóstico thedaddy (generado)"
          git push
