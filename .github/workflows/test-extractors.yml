name: Addon protocol tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # La salida se guarda para poder publicar el fallo como anotación: los
      # logs del job no siempre son accesibles por API, las anotaciones sí.
      # La salida va a un archivo porque los logs del job no siempre son
      # accesibles por API; el fallo se publica como anotación legible.
      - name: npm test
        id: pruebas
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
      - name: Publicar resultado como anotación
        if: always()
        run: |
          grep -E "^(not ok|✖|# (pass|fail|tests))|^ℹ (pass|fail|tests)" /tmp/test.log | head -60 | while IFS= read -r linea; do
            echo "::error::${linea}"
          done
          exit 0
      - name: Fallar si los tests fallaron
        if: steps.pruebas.outcome == 'failure'
        run: exit 1
      - run: npm audit --omit=dev
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t latino-addon:test .
      - name: Check image imports and provider modules
        run: docker run --rm latino-addon:test node -e "const {createApp} = require('./index'); createApp(); require('./engines/sites/extractor'); console.log('Image modules OK');"
