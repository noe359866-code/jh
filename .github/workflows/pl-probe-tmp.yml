name: Sonda de listas temporal
on:
  push:
    paths:
      - '.github/workflows/pl-probe-tmp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificación completa
        run: node scripts/verify.js 2>&1 | tee pl.log || true
      - name: Detalle por fuente
        run: |
          node -e "
            const fs = require('fs');
            const h = JSON.parse(fs.readFileSync('reports/health.json', 'utf8'));
            fs.writeFileSync('reports/pl-detail.txt', JSON.stringify(h.totals, null, 1));
          " || true
      - name: Publicar
        if: always()
        run: |
          mkdir -p reports
          tail -c 4000 pl.log > reports/pl-log.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/pl-log.txt reports/pl-detail.txt reports/health.json
          git diff --cached --quiet && echo sin-cambios || git commit -m "Sonda de listas (generado)"
          git push
