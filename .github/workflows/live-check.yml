name: Live source check
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated source ids (defaults to every source)
        required: false
        default: ''
        type: string

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar verificación en vivo
        run: node scripts/live-check.js || true
      - name: Verificar señales (canales caídos)
        run: node scripts/verify.js || true
      - name: Resumen
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('reports/live-check.json')) { console.log('sin reporte'); process.exit(0); }
            const r = require('./reports/live-check.json');
            const summary = { ok: r.ok, totals: r.totals, sources: r.sources, checks: r.checks, playlistEntries: r.playlistEntries };
            console.log(JSON.stringify(summary, null, 1));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify(summary, null, 1) + '\n```\n');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: |
            reports/live-check.json
            reports/health.json
            reports/dead.txt
          if-no-files-found: warn
          retention-days: 7
