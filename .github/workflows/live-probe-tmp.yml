name: Live probe temporal
on:
  push:
    paths:
      - '.github/workflows/live-probe-tmp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recolectar catálogo real
        run: node scripts/live-check.js || true
      - name: Publicar resumen
        if: always()
        run: |
          mkdir -p reports
          node -e "const fs=require('fs');const f='reports/live-check.json';if(!fs.existsSync(f)){fs.writeFileSync('reports/probe-final.txt','sin reporte');process.exit(0);}const r=JSON.parse(fs.readFileSync(f,'utf8'));fs.writeFileSync('reports/probe-final.txt',JSON.stringify({ok:r.ok,totals:r.totals,sources:r.sources,checks:r.checks,playlistEntries:r.playlistEntries},null,1));"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/probe-final.txt
          git diff --cached --quiet && echo sin-cambios || git commit -m "Resumen en vivo (generado)"
          git push
