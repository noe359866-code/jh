name: Sonda de extracción temporal
on:
  push:
    paths:
      - '.github/workflows/extract-probe-tmp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extracción real de embeds
        run: node scripts/verify.js 2>&1 | tee reports-extract.log || true
      - name: Publicar
        if: always()
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('reports',{recursive:true});" 
          tail -c 3000 reports-extract.log > reports/extract-log.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/extract-log.txt
          git diff --cached --quiet && echo sin-cambios || git commit -m "Log de extracción (generado)"
          git push
