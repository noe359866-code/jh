name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agregador-iptv:test .
      - name: Check image loads the app and sources
        run: docker run --rm agregador-iptv:test node -e "const {createApp}=require('./index');createApp();const r=require('./engines/live/sources');console.log('Módulos OK · fuentes:', r.sources.length)"
